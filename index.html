<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050505">
<title>Neon Snake</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:#050505;
  overflow:hidden;
  position:fixed;
  top:0;left:0;
  font-family:'Arial',sans-serif;
  touch-action:none;
}
canvas{
  display:block;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
}
#dpad{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:60px 60px 60px;
  grid-template-rows:60px 60px;
  gap:6px;
  z-index:10;
  opacity:0.85;
}
#dpad button{
  width:60px;height:60px;
  background:rgba(34,197,94,0.18);
  border:2px solid rgba(34,197,94,0.5);
  border-radius:14px;
  color:#22c55e;
  font-size:26px;
  line-height:1;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.1s,transform 0.08s;
  -webkit-tap-highlight-color:transparent;
}
#dpad button:active{
  background:rgba(34,197,94,0.45);
  transform:scale(0.9);
}
#btn-up   {grid-column:2;grid-row:1;}
#btn-left {grid-column:1;grid-row:2;}
#btn-down {grid-column:2;grid-row:2;}
#btn-right{grid-column:3;grid-row:2;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dpad">
  <button id="btn-up">▲</button>
  <button id="btn-left">◀</button>
  <button id="btn-down">▼</button>
  <button id="btn-right">▶</button>
</div>
<script>
if(window.Telegram&&window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

document.body.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let W,H,CELL,COLS,ROWS,OX,OY;

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  CELL=Math.floor(Math.min(W,H)/18);
  COLS=Math.floor((W*0.95)/CELL);
  ROWS=Math.floor((H*0.72)/CELL);
  OX=Math.floor((W-COLS*CELL)/2);
  OY=Math.floor((H-ROWS*CELL)/2)+20;
}
resize();
window.addEventListener('resize',()=>{resize();if(state==='dead'||state==='start')draw();});

// --- GAME STATE ---
let snake,dir,nextDir,food,score,bestScore,alive,started,frame,speedTick;
let particles=[];
let state='start'; // start | play | dead

function initGame(){
  const sx=Math.floor(COLS/2), sy=Math.floor(ROWS/2);
  snake=[{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  food=spawnFood();
  score=0; alive=true; started=false; frame=0; speedTick=0;
  particles=[];
  state='play';
}

function spawnFood(){
  let f,attempts=0;
  do{
    f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
    attempts++;
  }while(snake.some(s=>s.x===f.x&&s.y===f.y)&&attempts<200);
  return f;
}

function step(){
  if(!(nextDir.x===-dir.x&&nextDir.y===-dir.y))dir={...nextDir};
  const head={
    x:(snake[0].x+dir.x+COLS)%COLS,
    y:(snake[0].y+dir.y+ROWS)%ROWS
  };
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){
    alive=false;
    state='dead';
    if(score>bestScore)bestScore=score;
    spawnDeathParticles();
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;
    spawnEatParticles();
    food=spawnFood();
  } else {
    snake.pop();
  }
}

function spawnEatParticles(){
  const cx=OX+food.x*CELL+CELL/2;
  const cy=OY+food.y*CELL+CELL/2;
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*4;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:'#ff2d55',r:3+Math.random()*3});
  }
}

function spawnDeathParticles(){
  const head=snake[0];
  const cx=OX+head.x*CELL+CELL/2;
  const cy=OY+head.y*CELL+CELL/2;
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2;
    const sp=1+Math.random()*6;
    const hue=100+i*8;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:`hsl(${hue},100%,60%)`,r:2+Math.random()*5});
  }
}

// --- DRAW ---
function drawGrid(){
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=0.5;
  for(let r=0;r<=ROWS;r++){
    ctx.beginPath();
    ctx.moveTo(OX,OY+r*CELL);
    ctx.lineTo(OX+COLS*CELL,OY+r*CELL);
    ctx.stroke();
  }
  for(let c=0;c<=COLS;c++){
    ctx.beginPath();
    ctx.moveTo(OX+c*CELL,OY);
    ctx.lineTo(OX+c*CELL,OY+ROWS*CELL);
    ctx.stroke();
  }
}

function drawBorder(){
  ctx.strokeStyle='rgba(34,197,94,0.3)';
  ctx.lineWidth=1.5;
  ctx.strokeRect(OX-1,OY-1,COLS*CELL+2,ROWS*CELL+2);
}

function drawSnake(){
  snake.forEach((s,i)=>{
    const t=1-i/snake.length;
    const hue=120+i*3;
    const light=40+t*30;
    ctx.fillStyle=`hsl(${hue},100%,${light}%)`;
    ctx.shadowColor=`hsl(${hue},100%,65%)`;
    ctx.shadowBlur=i===0?18:6;
    const pad=i===0?1:2;
    ctx.beginPath();
    if(i===0){
      ctx.roundRect(OX+s.x*CELL+pad,OY+s.y*CELL+pad,CELL-pad*2,CELL-pad*2,6);
    } else {
      ctx.roundRect(OX+s.x*CELL+pad,OY+s.y*CELL+pad,CELL-pad*2,CELL-pad*2,3);
    }
    ctx.fill();
    ctx.shadowBlur=0;

    // eyes on head
    if(i===0){
      ctx.fillStyle='#fff';
      const eyeSize=Math.max(2,CELL*0.12);
      const ex=OX+s.x*CELL+CELL/2;
      const ey=OY+s.y*CELL+CELL/2;
      let e1x=ex-eyeSize*1.2,e1y=ey-eyeSize*1.2;
      let e2x=ex+eyeSize*1.2,e2y=ey-eyeSize*1.2;
      if(dir.x===1){e1x=ex+eyeSize;e1y=ey-eyeSize;e2x=ex+eyeSize;e2y=ey+eyeSize;}
      else if(dir.x===-1){e1x=ex-eyeSize;e1y=ey-eyeSize;e2x=ex-eyeSize;e2y=ey+eyeSize;}
      else if(dir.y===1){e1x=ex-eyeSize;e1y=ey+eyeSize;e2x=ex+eyeSize;e2y=ey+eyeSize;}
      ctx.beginPath();ctx.arc(e1x,e1y,eyeSize,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e2x,e2y,eyeSize,0,Math.PI*2);ctx.fill();
    }
  });
}

function drawFood(){
  const cx=OX+food.x*CELL+CELL/2;
  const cy=OY+food.y*CELL+CELL/2;
  const r=CELL/2-3;
  const pulse=0.85+Math.sin(frame*0.1)*0.15;

  ctx.fillStyle='#ff2d55';
  ctx.shadowColor='#ff2d55';
  ctx.shadowBlur=20;
  ctx.beginPath();
  ctx.arc(cx,cy,r*pulse,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // glint
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(cx-r*0.25,cy-r*0.25,r*0.25,0,Math.PI*2);
  ctx.fill();
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=0.2;
    p.life-=0.025;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  // score box
  ctx.fillStyle='rgba(0,0,0,0.6)';
  const sw=120,sh=36;
  const sx2=W/2-sw/2,sy2=OY-sh-8;
  ctx.beginPath();
  ctx.roundRect(sx2,sy2,sw,sh,18);
  ctx.fill();

  ctx.fillStyle='#22c55e';
  ctx.font=`bold ${Math.max(16,CELL-2)}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('🐍 '+score, W/2, sy2+sh/2);

  // best score
  if(bestScore>0){
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font=`${Math.max(12,CELL-8)}px Arial`;
    ctx.fillText('Рекорд: '+bestScore, W/2, sy2-14);
  }
}

function drawStartScreen(){
  ctx.fillStyle='#050505';
  ctx.fillRect(0,0,W,H);
  drawGrid();
  drawBorder();

  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#22c55e';
  ctx.shadowColor='#22c55e';
  ctx.shadowBlur=30;
  ctx.font=`bold ${Math.max(36,CELL*2.5)}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('NEON', W/2, H/2-60);
  ctx.fillText('SNAKE', W/2, H/2-10);
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font=`${Math.max(16,CELL)}px Arial`;
  ctx.fillText('ТАП — начать', W/2, H/2+55);

  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.font=`13px Arial`;
  ctx.fillText('свайпай чтобы поворачивать', W/2, H/2+85);
}

function drawDeadScreen(){
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#22c55e';
  ctx.font=`bold ${Math.max(28,CELL*2)}px Arial`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.shadowColor='#22c55e';
  ctx.shadowBlur=20;
  ctx.fillText('GAME OVER', W/2, H/2-60);
  ctx.shadowBlur=0;

  ctx.fillStyle='#fff';
  ctx.font=`bold ${Math.max(20,CELL+4)}px Arial`;
  ctx.fillText('Длина: '+snake.length, W/2, H/2-10);

  ctx.fillStyle='#ffd600';
  ctx.font=`bold ${Math.max(16,CELL)}px Arial`;
  ctx.fillText('Рекорд: '+bestScore, W/2, H/2+28);

  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font=`${Math.max(14,CELL-2)}px Arial`;
  ctx.fillText('ТАП — заново', W/2, H/2+70);
}

function draw(){
  ctx.fillStyle='#050505';
  ctx.fillRect(0,0,W,H);

  if(state==='start'){
    drawStartScreen();
    return;
  }

  drawGrid();
  drawBorder();
  drawFood();
  drawSnake();
  drawParticles();
  drawHUD();

  if(state==='dead'){
    drawDeadScreen();
    drawParticles();
  }
}

// --- GAME LOOP ---
let lastTime=0;
const TARGET_FPS=60;

function getSpeed(){
  // 8fps на старте, до 16fps при score>20
  return Math.min(16,8+Math.floor(score/4));
}

function loop(ts){
  requestAnimationFrame(loop);
  const dt=ts-lastTime;
  if(dt<1000/TARGET_FPS)return;
  lastTime=ts;

  frame++;

  if(state==='play'&&alive){
    speedTick++;
    const interval=Math.floor(TARGET_FPS/getSpeed());
    if(speedTick>=interval){
      speedTick=0;
      step();
    }
  }

  draw();
}

// --- INPUT ---
let tx0=0,ty0=0;
const SWIPE_THRESH=20;

function handleTouchStart(e){
  e.preventDefault();
  tx0=e.touches[0].clientX;
  ty0=e.touches[0].clientY;

  if(state==='start'){
    initGame();
    bestScore=bestScore||0;
    return;
  }
  if(state==='dead'){
    initGame();
    return;
  }
}

function handleTouchEnd(e){
  e.preventDefault();
  if(state!=='play')return;

  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;

  if(Math.abs(dx)<SWIPE_THRESH&&Math.abs(dy)<SWIPE_THRESH){
    // tap — ничего
    return;
  }

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>0&&dir.x!==- 1) nextDir={x:1,y:0};
    else if(dx<0&&dir.x!==1) nextDir={x:-1,y:0};
  } else {
    if(dy>0&&dir.y!==-1) nextDir={x:0,y:1};
    else if(dy<0&&dir.y!==1) nextDir={x:0,y:-1};
  }
}

canvas.addEventListener('touchstart',handleTouchStart,{passive:false});
canvas.addEventListener('touchend',handleTouchEnd,{passive:false});

// D-PAD кнопки
function dpadPress(dx,dy){
  if(state==='start'){initGame();bestScore=bestScore||0;return;}
  if(state==='dead'){initGame();return;}
  if(dx===1&&dir.x!==-1)nextDir={x:1,y:0};
  else if(dx===-1&&dir.x!==1)nextDir={x:-1,y:0};
  else if(dy===1&&dir.y!==-1)nextDir={x:0,y:1};
  else if(dy===-1&&dir.y!==1)nextDir={x:0,y:-1};
}
function bindBtn(id,dx,dy){
  const btn=document.getElementById(id);
  btn.addEventListener('touchstart',e=>{e.preventDefault();dpadPress(dx,dy);},{passive:false});
  btn.addEventListener('mousedown',e=>{e.preventDefault();dpadPress(dx,dy);});
}
bindBtn('btn-up',   0,-1);
bindBtn('btn-down', 0, 1);
bindBtn('btn-left',-1, 0);
bindBtn('btn-right',1, 0);

// клавиатура для дебага на ПК
document.addEventListener('keydown',e=>{
  if(state==='start'){initGame();return;}
  if(state==='dead'){initGame();return;}
  if(e.key==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};
  if(e.key==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};
  if(e.key==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};
  if(e.key==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};
  e.preventDefault();
});

canvas.addEventListener('mousedown',()=>{
  if(state==='start'){initGame();return;}
  if(state==='dead'){initGame();return;}
});

// --- START ---
bestScore=0;
requestAnimationFrame(loop);
</script>
</body>
</html>
